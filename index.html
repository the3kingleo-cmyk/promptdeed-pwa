<script>
/* ---------- DATA ---------- */
const DATA = {"brand":{"name":"Promptdeed","tagline":"Your deed to done-for-you copy.","headline":"Stop Getting Generic Output. Start Getting Copy That Closes.","subheadline":"For busy residential agents, Promptdeed turns ChatGPT and Claude into a copywriter who actually knows real estate.","voice":"Direct, Practical, Agent-fluent","audience":"US residential real estate agents"},"categories":[{"id":1,"name":"Listing Descriptions & Property Marketing","description":"Write compelling MLS and marketing copy for listings","order":1},{"id":2,"name":"Social Media Content (Instagram, Facebook, TikTok)","description":"Engaging captions, reels scripts, and post hooks","order":2},{"id":3,"name":"Lead Follow-Up & Nurture Emails","description":"Email sequences that convert leads into clients","order":3},{"id":4,"name":"FSBO & Expired Listing Scripts","description":"Conversion scripts for hard-to-win seller leads","order":4},{"id":5,"name":"Buyer Consultation & Discovery","description":"Questions and frameworks for buyer meetings","order":5},{"id":6,"name":"Seller Listing Presentations","description":"Win listings with confidence","order":6},{"id":7,"name":"Open House Marketing & Scripts","description":"Drive traffic and convert open house visitors","order":7},{"id":8,"name":"Market Reports & Neighborhood Guides","description":"Position yourself as the local expert","order":8},{"id":9,"name":"Negotiation, Offers & Closing Communication","description":"Communicate clearly through the deal","order":9},{"id":10,"name":"Personal Branding, Bio & Video Scripts","description":"Build your brand and on-camera presence","order":10}],"prompts":[{"id":1,"category_id":1,"idx":1,"title":"Luxury Listing Description (MLS-Optimized)","text":"You are an expert real estate copywriter who writes for luxury and high-end residential listings.\n\nYour job: write an MLS listing description that is both editorially compelling AND MLS-compliant — no fair-housing violations, no exaggerated claims about returns, no language that could be construed as steering.\n\nINPUTS:\n[PROPERTY ADDRESS]\n[LIST PRICE]\n[BEDROOMS] / [BATHROOMS] / [SQUARE FEET] / [LOT SIZE] / [YEAR BUILT]\n[KEY FEATURES] (comma-separated)\n[NEIGHBORHOOD]\n[UNIQUE SELLING POINTS]\n[COMPARABLE CONTEXT]\n[TARGET BUYER]\n[TONE] (e.g. aspirational, editorial, sophisticated)\n[WORD COUNT]\n\nOUTPUT FORMAT:\n- Lead with a magnetic opening sentence that paints a lifestyle picture.\n- Body in 2–4 short paragraphs (no bullet lists). Weave in 3–5 of the strongest features naturally — don't list every input.\n- Close with a paragraph that anchors location and a soft call-to-tour.\n- Stay within ±10% of [WORD COUNT].\n- Avoid: \"must see,\" \"won't last,\" \"motivated seller,\" any reference to protected classes, any school-quality claim.\n\nReturn only the description. No headings, no explanations.","input":"[PROPERTY ADDRESS]: 4821 Harborview Lane, Newport Beach, CA\n[LIST PRICE]: $3,250,000\n[BEDROOMS]: 5\n[BATHROOMS]: 4 full, 1 half\n[SQUARE FEET]: 4,850\n[LOT SIZE]: 0.38 acres\n[YEAR BUILT]: 2019\n[KEY FEATURES]: chef's kitchen with Sub-Zero and Wolf appliances, primary suite with ocean-view balcony, temperature-controlled wine cellar, resort-style pool and spa, 4-car garage, whole-home Lutron smart lighting, solar panels\n[NEIGHBORHOOD]: Newport Beach, steps from Back Bay Nature Preserve\n[UNIQUE SELLING POINTS]: unobstructed Catalina Island views, no HOA, corner lot with maximum privacy\n[COMPARABLE CONTEXT]: similar homes sold $3.1M–$3.5M in past 6 months\n[TARGET BUYER]: affluent move-up buyer or second-home buyer seeking coastal California lifestyle\n[TONE]: aspirational, editorial, sophisticated — think Architectural Digest\n[WORD COUNT]: 280","output":"Rarely does a residence so effortlessly merge architectural precision with the boundless spirit of the California coast. Set on a private corner lot in one of Newport Beach's most coveted enclaves, 4821 Harborview Lane is a 2019-built masterwork where every detail has been curated for those who refuse to compromise.\n\nFive bedrooms and four-and-a-half baths unfold across 4,850 square feet of light-drenched living space, anchored by a chef's kitchen outfitted with Sub-Zero refrigeration and Wolf professional appliances. Entertain without limitation — a temperature-controlled wine cellar awaits your collection while the resort-style pool and spa transform the 0.38-acre grounds into a private retreat.\n\nAscend to the primary suite and step onto your private balcony where unobstructed views of Catalina Island greet each morning. Whole-home Lutron smart lighting, owned solar panels, and a 4-car garage ensure every modern convenience is accounted for — without the constraints of an HOA.\n\nSteps from the Back Bay Nature Preserve and minutes from Newport Beach's most celebrated dining and coastline, this is more than a home — it's a deed to the coastal California lifestyle most can only imagine. Schedule your private tour today."},{"id":2,"category_id":1,"idx":2,"title":"Entry-Level Home Description for First-Time Buyers","text":"You are a real estate copywriter who specializes in making entry-level and starter homes feel warm, achievable, and exciting to first-time buyers — without sounding condescending or over-hyped.\n\nINPUTS:\n[PROPERTY ADDRESS]\n[LIST PRICE]\n[BEDROOMS] / [BATHROOMS] / [SQUARE FEET] / [YEAR BUILT]\n[KEY FEATURES] (comma-separated)\n[NEIGHBORHOOD]\n[NEARBY AMENITIES] (schools, parks, transit, shopping)\n[RECENT UPDATES] (if any)\n[TARGET BUYER]\n[WORD COUNT]\n\nOUTPUT FORMAT:\n- Open with a warm, inviting line that speaks to starting fresh, not \"starter home\" clichés.\n- Body in 2-3 short paragraphs. Emphasize move-in readiness, value, and lifestyle fit over square footage stats alone.\n- Mention practical selling points (updates, low-maintenance features, walkability) plainly and honestly.\n- Close with a friendly, low-pressure call to action.\n- Stay within +/-10% of [WORD COUNT].\n- Avoid: \"perfect starter home,\" \"won't last,\" any reference to protected classes, any implication about who \"belongs\" in the neighborhood, exaggerated investment claims.\n\nReturn only the description. No headings, no explanations.","input":"[PROPERTY ADDRESS]: 118 Maple Crest Court, Round Rock, TX\n[LIST PRICE]: $289,000\n[BEDROOMS]: 3\n[BATHROOMS]: 2\n[SQUARE FEET]: 1,420\n[YEAR BUILT]: 1998\n[KEY FEATURES]: fenced backyard, attached 2-car garage, updated kitchen countertops, new HVAC (2024), open living/dining layout\n[NEIGHBORHOOD]: Round Rock, near Old Settlers Park\n[NEARBY AMENITIES]: A-rated elementary school two blocks away, walking trail access, grocery store 5 minutes away, easy access to Hwy 79\n[RECENT UPDATES]: new HVAC system installed 2024, fresh interior paint throughout\n[TARGET BUYER]: first-time buyer or young family looking to stop renting\n[WORD COUNT]: 220","output":"There's a particular kind of relief that comes with turning your own key for the first time, and 118 Maple Crest Court was made for that moment. Set on a quiet cul-de-sac in Round Rock, this 3-bedroom, 2-bath home offers 1,420 square feet of comfortable, easy-to-love living space.\n\nStep inside to an open living and dining layout that makes the home feel bigger than its footprint, anchored by a kitchen with updated countertops ready for your first dinner party. A brand-new HVAC system (2024) and fresh paint throughout mean the big-ticket items are already handled — move in and actually enjoy it instead of tackling a project list.\n\nOut back, a fully fenced yard gives you room to garden, grill, or just relax, while the attached 2-car garage keeps everyday life simple. You're two blocks from an A-rated elementary school, minutes from Old Settlers Park's walking trails, and close to everyday shopping — everything you need, right where you need it.\n\nIf you've been ready to stop paying someone else's mortgage, this one's worth a look. Reach out to schedule your showing."},{"id":3,"category_id":1,"idx":3,"title":"Fixer-Upper / Investor Listing Description","text":"You are a real estate copywriter writing for investor and renovator buyers. Your job is to frame a property's as-is condition and upside honestly and legally — highlighting potential without making guaranteed-return claims or misrepresenting the property's condition.\n\nINPUTS:\n[PROPERTY ADDRESS]\n[LIST PRICE]\n[BEDROOMS] / [BATHROOMS] / [SQUARE FEET] / [LOT SIZE] / [YEAR BUILT]\n[CONDITION NOTES] (what needs work, what's solid)\n[UPSIDE FACTORS] (location trends, lot potential, comps context — factual only)\n[NEIGHBORHOOD]\n[TARGET BUYER] (flipper, landlord, sweat-equity owner-occupant)\n[WORD COUNT]\n\nOUTPUT FORMAT:\n- Open with a direct, confident line that signals \"opportunity\" without hiding that work is needed.\n- Body in 2-3 paragraphs: be transparent about condition, then pivot to factual upside (lot size, location, structural bones).\n- Never state or imply a specific resale value, ROI percentage, or \"guaranteed\" profit.\n- Close with a practical, no-pressure call to action (e.g., \"cash or renovation-loan buyers welcome\").\n- Stay within +/-10% of [WORD COUNT].\n- Avoid: any profit/ROI projections, \"flip and flip fast,\" misrepresenting known defects, references to protected classes.\n\nReturn only the description. No headings, no explanations.","input":"[PROPERTY ADDRESS]: 742 Ivywood Street, Dayton, OH\n[LIST PRICE]: $94,500\n[BEDROOMS]: 4\n[BATHROOMS]: 1.5\n[SQUARE FEET]: 1,850\n[LOT SIZE]: 0.22 acres\n[YEAR BUILT]: 1954\n[CONDITION NOTES]: original hardwood floors intact under carpet, roof replaced 2016, kitchen and both bathrooms need full renovation, foundation inspected with no structural issues noted, some knob-and-tube wiring remains in upper level\n[UPSIDE FACTORS]: corner lot with alley access, three comparable homes on the same block sold fully renovated in the past year, walkable to a revitalizing commercial strip\n[NEIGHBORHOOD]: Belmont neighborhood, Dayton\n[TARGET BUYER]: investor or owner-occupant comfortable with a renovation project\n[WORD COUNT]: 230","output":"742 Ivywood Street is a solid brick 4-bedroom on a generous 0.22-acre corner lot in Dayton's Belmont neighborhood — sold as-is, priced for the work it needs.\n\nThe bones are good: a 2016 roof, a foundation that passed inspection with no structural concerns noted, and original hardwood floors waiting under the carpet in the main living areas. What it needs is honest — both bathrooms and the kitchen require full renovation, and some knob-and-tube wiring remains on the upper level and should be budgeted for. This is a project, not a turnkey home.\n\nThe upside is in the location: this is a corner lot with alley access for potential off-street parking, and three comparable homes on the same block have sold fully renovated within the past year, pointing to real buyer demand in the immediate area once updated. It's a short walk to a commercial strip that's seeing new investment.\n\nPriced accordingly for a renovation project. Cash buyers, renovation-loan buyers, and contractors welcome to tour — inspection reports available on request."},{"id":4,"category_id":1,"idx":4,"title":"Luxury Estate Property Brochure Copy","text":"You are a luxury real estate copywriter creating print-brochure-style copy for a high-end estate listing — more expansive and sensory than a standard MLS description, meant for a glossy print or PDF brochure.\n\nINPUTS:\n[PROPERTY ADDRESS]\n[LIST PRICE]\n[BEDROOMS] / [BATHROOMS] / [SQUARE FEET] / [LOT SIZE / ACREAGE]\n[ARCHITECTURAL STYLE]\n[SIGNATURE FEATURES] (comma-separated, prioritize the 4-6 most impressive)\n[GROUNDS/OUTDOOR FEATURES]\n[NEIGHBORHOOD/SETTING]\n[TARGET BUYER]\n[SECTION HEADERS DESIRED] (e.g., Overview, Interiors, Grounds, Location)\n\nOUTPUT FORMAT:\n- Write in sections with the requested headers, each 2-4 sentences of rich, sensory, editorial-quality copy.\n- Total length should feel brochure-scaled — more expansive than a standard MLS blurb, roughly 400-500 words across all sections.\n- Avoid generic superlatives (\"stunning,\" \"amazing\") in favor of specific, vivid detail.\n- No fair-housing violations, no reference to protected classes, no exaggerated investment/appreciation claims.\n\nReturn the brochure copy with section headers as plain text (e.g., \"OVERVIEW\", \"INTERIORS\"). No additional commentary.","input":"[PROPERTY ADDRESS]: 12 Stonebridge Ridge, Aspen, CO\n[LIST PRICE]: $14,900,000\n[BEDROOMS]: 6\n[BATHROOMS]: 7 full, 2 half\n[SQUARE FEET]: 9,200\n[LOT SIZE / ACREAGE]: 4.1 acres\n[ARCHITECTURAL STYLE]: contemporary mountain lodge, timber and stone construction\n[SIGNATURE FEATURES]: floor-to-ceiling windows facing Aspen Mountain, indoor-outdoor great room with retractable glass walls, home theater, wine cellar with tasting room, heated driveway and motor court\n[GROUNDS/OUTDOOR FEATURES]: private hiking trail access, outdoor kitchen and fire pit terrace, heated infinity-edge pool overlooking the valley\n[NEIGHBORHOOD/SETTING]: private gated enclave 8 minutes from downtown Aspen\n[TARGET BUYER]: ultra-high-net-worth buyer seeking a primary residence or trophy second home\n[SECTION HEADERS DESIRED]: Overview, Interiors, Grounds, Location","output":"OVERVIEW\nTwelve Stonebridge Ridge is a study in scale and stillness — 9,200 square feet of contemporary mountain lodge architecture set on 4.1 private acres, where timber and stone give way to walls of glass framing Aspen Mountain itself. Six bedrooms and nine baths are arranged across a floor plan built for both grand entertaining and quiet retreat.\n\nINTERIORS\nAt the heart of the residence, a great room with retractable glass walls dissolves the boundary between indoors and out, opening fully to mountain air on temperate days. A dedicated wine cellar with private tasting room and a home theater built for serious cinema round out the entertaining spaces, while the heated motor court and driveway make Aspen winters an afterthought.\n\nGROUNDS\nOutside, a heated infinity-edge pool holds the valley in its reflection, framed by an outdoor kitchen and fire pit terrace built for long mountain evenings. A private trailhead grants direct access to hiking terrain most owners only dream of reaching from their own backyard.\n\nLOCATION\nSet within a private gated enclave just eight minutes from downtown Aspen, this is proximity without compromise — the seclusion of a true estate with the town's restaurants, galleries, and slopes minutes away."},{"id":5,"category_id":1,"idx":5,"title":"Just-Listed Multi-Channel Marketing Kit","text":"You are a real estate marketing assistant. Generate a coordinated \"just listed\" content kit for a single property, formatted for four different channels in one response, so the agent can post everywhere at once.\n\nINPUTS:\n[PROPERTY ADDRESS]\n[LIST PRICE]\n[BEDROOMS] / [BATHROOMS] / [SQUARE FEET]\n[TOP 3 FEATURES]\n[NEIGHBORHOOD]\n[OPEN HOUSE DATE/TIME] (if applicable)\n[AGENT NAME] / [AGENT PHONE OR LINK]\n\nOUTPUT FORMAT (produce all four, clearly labeled):\n1. MLS-STYLE DESCRIPTION (120-150 words, standard listing copy)\n2. INSTAGRAM CAPTION (short, high-energy, 3-5 relevant hashtags, emoji used sparingly)\n3. FACEBOOK POST (slightly longer, conversational, ends with a question to drive comments)\n4. TEXT MESSAGE BLAST (under 300 characters, for the agent's SOI/lead list, includes a clear call to action)\n\nAcross all four: no fair-housing violations, no protected-class references, no \"won't last\"/urgency-manipulation language, no unverified claims.\n\nReturn the four pieces labeled exactly as above. No extra commentary.","input":"[PROPERTY ADDRESS]: 55 Larkspur Lane, Charlotte, NC\n[LIST PRICE]: $475,000\n[BEDROOMS]: 4\n[BATHROOMS]: 3\n[SQUARE FEET]: 2,600\n[TOP 3 FEATURES]: finished walkout basement, quiet cul-de-sac lot, renovated kitchen with quartz counters\n[NEIGHBORHOOD]: Providence Plantation, Charlotte\n[OPEN HOUSE DATE/TIME]: Saturday, June 14, 12-2 PM\n[AGENT NAME]: Dana Whitfield\n[AGENT PHONE OR LINK]: (704) 555-0192","output":"MLS-STYLE DESCRIPTION\nWelcome to 55 Larkspur Lane, a spacious 4-bedroom, 3-bath home tucked into a quiet cul-de-sac in Providence Plantation. The renovated kitchen features quartz countertops and updated cabinetry, opening to a bright living area ideal for everyday life and entertaining alike. Downstairs, a finished walkout basement adds flexible bonus space — perfect for a home office, gym, or media room. With 2,600 square feet of comfortable living and a peaceful setting, this home is ready for its next chapter. Contact Dana Whitfield to schedule a private tour.\n\nINSTAGRAM CAPTION\nJust listed in Providence Plantation! 🏡 4 beds, 3 baths, a finished walkout basement, and a kitchen that's already done the work for you. Quiet cul-de-sac, move-in ready. Open house Saturday 6/14, 12-2 PM — come see it in person. #JustListed #CharlotteRealEstate #ProvidencePlantation #OpenHouse #NCHomes\n\nFACEBOOK POST\nJust listed: 55 Larkspur Lane in Providence Plantation! This one has it all — a renovated kitchen with quartz counters, a finished walkout basement for extra living space, and a quiet cul-de-sac setting that's hard to find. Swing by the open house this Saturday, June 14th from 12-2 PM, or reach out anytime for a private showing. What's the first thing you'd do with a finished basement like this?\n\nTEXT MESSAGE BLAST\nJust listed: 55 Larkspur Lane, Providence Plantation — 4bd/3ba, finished walkout basement, renovated kitchen. $475,000. Open house Sat 6/14, 12-2pm. Want a private showing first? Call/text me — Dana, (704) 555-0192"},{"id":6,"category_id":2,"idx":1,"title":"Instagram Carousel: Just-Sold Story","text":"","input":"","output":""},{"id":7,"category_id":2,"idx":2,"title":"30-Second Reel Script: Neighborhood Spotlight","text":"","input":"","output":""},{"id":8,"category_id":2,"idx":3,"title":"Facebook Post: Open House Invitation","text":"","input":"","output":""},{"i ":""},{"id":27,"category_id":6,"idx":2,"title":"Listing Presentation Outline (10 Slides)","text":"","input":"","output":""},{"id":28,"category_id":6,"idx":3,"title":"Pricing Strategy Talking Points","text":"","input":"","output":""},{"id":29,"category_id":6,"idx":4,"title":"Seller Net Sheet Explanation Script","text":"","input":"","output":""},{"id":30,"category_id":6,"idx":5,"title":"Commission Objection Response Script","text":"","input":"","output":""},{"id":31,"category_id":7,"idx":1,"title":"Open House Multi-Channel Promo Pack","text":"","input":"","output":""},{"id":32,"category_id":7,"idx":2,"title":"Open House Visitor Sign-In Script","text":"","input":"","output":""},{"id":33,"category_id":7,"idx":3,"title":"Door-Knocking Script for Open House Promotion","text":"","input":"","output":""},{"id":34,"category_id":7,"idx":4,"title":"Open House Follow-Up Email (24-Hour)","text":"","input":"","output":""},{"id":35,"category_id":7,"idx":5,"title":"Open House Neighbor Invitation Letter","text":"","input":"","output":""},{"id":36,"category_id":8,"idx":1,"title":"Monthly Market Update Email","text":"","input":"","output":""},{"id":37,"category_id":8,"idx":2,"title":"Neighborhood Guide (1,000-Word Blog Post)","text":"","input":"","output":""},{"id":38,"category_id":8,"idx":3,"title":"Quarterly Market Report PDF Outline","text":"","input":"","output":""},{"id":39,"category_id":8,"idx":4,"title":"School District Comparison Guide","text":"","input":"","output":""},{"id":40,"category_id":8,"idx":5,"title":"\"Is Now a Good Time to Buy?\" Article","text":"","input":"","output":""},{"id":41,"category_id":9,"idx":1,"title":"Offer Submission Cover Letter","text":"","input":"","output":""},{"id":42,"category_id":9,"idx":2,"title":"Multiple-Offer Strategy Email to Buyer","text":"","input":"","output":""},{"id":43,"category_id":9,"idx":3,"title":"Counter-Offer Communication Script","text":"","input":"","output":""},{"id":44,"category_id":9,"idx":4,"title":"Inspection Negotiation Talking Points","text":"","input":"","output":""},{"id":45,"category_id":9,"idx":5,"title":"Closing Day Communication Email","text":"","input":"","output":""},{"id":46,"category_id":10,"idx":1,"title":"Agent Bio (Long-Form Website Version)","text":"","input":"","output":""},{"id":47,"category_id":10,"idx":2,"title":"Short Agent Bio (Social Media)","text":"","input":"","output":""},{"id":48,"category_id":10,"idx":3,"title":"60-Second \"About Me\" Video Script","text":"","input":"","output":""},{"id":49,"category_id":10,"idx":4,"title":"Listing Walk-Through Video Script","text":"","input":"","output":""},{"id":50,"category_id":10,"idx":5,"title":"Year-End Recap Video Script","text":"","input":"","output":""}],"free_prompt_count":5,"unlock_code":"PROMPTDEED-LAUNCH-2026"};

/* ---------- STATE ---------- */
const STATE = {
  unlocked: localStorage.getItem('promptdeed_unlocked') === '1',
  view: 'home',
  catId: null,
  promptId: null
};

/* ---------- HELPERS ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const root = $('#root');
const modal = $('#modal');

function showModal(title, body) {
  $('#modal-title').textContent = title;
  $('#modal-body').textContent = body;
  modal.classList.add('show');
}
$('#modal-ok').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

let lockedContentLoaded = false;
async function loadLockedContent() {
  if (lockedContentLoaded) return true;
  try {
    const res = await fetch('locked-content.json', { cache: 'no-store' });
    if (!res.ok) return false;
    const content = await res.json();
    DATA.prompts.forEach((p) => {
      if (content[p.id]) {
        p.text = content[p.id].text;
        p.input = content[p.id].input;
        p.output = content[p.id].output;
      }
    });
    lockedContentLoaded = true;
    return true;
  } catch (e) {
    return false;
  }
}

function isLocked(promptIdx) {
  // first 5 prompts (by global ID 1-5) are free; rest locked unless unlocked
  return !STATE.unlocked && promptIdx > DATA.free_prompt_count;
}

function copyToClipboard(text, btn) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else { fallback(); }
  if (btn) {
    btn.classList.add('copied');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1400);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- VIEWS ---------- */
function renderHome() {
  STATE.view = 'home'; STATE.catId = null; STATE.promptId = null;
  const intro = `
    <p class="section-title">Browse Categories</p>
    <div class="unlock-state">
      ${STATE.unlocked
        ? '<strong>Unlocked.</strong> All 50 prompts available.'
        : `<strong>Free preview.</strong> First ${DATA.free_prompt_count} prompts unlocked. Enter your code in Settings to unlock all 50.`}
    </div>
  `;
  const cards = DATA.categories.map((c) => {
    const promptCount = DATA.prompts.filter((p) => p.category_id === c.id).length;
    return `
      <div class="card" data-cat="${c.id}">
        <h3>${escapeHtml(c.name)}</h3>
        <p>${escapeHtml(c.description)}</p>
        <div class="meta">${promptCount} prompts</div>
      </div>
    `;
  }).join('');
  root.innerHTML = intro + '<div class="cards">' + cards + '</div>';
  root.querySelectorAll('.card').forEach((el) => {
    el.addEventListener('click', () => renderCategory(parseInt(el.dataset.cat, 10)));
  });
}

function renderCategory(catId) {
  STATE.view = 'category'; STATE.catId = catId;
  const cat = DATA.categories.find((c) => c.id === catId);
  const items = DATA.prompts.filter((p) => p.category_id === catId);
  const list = items.map((p) => {
    const locked = isLocked(p.id);
    return `
      <div class="prompt-item ${locked ? 'locked' : ''}" data-pid="${p.id}">
        <div class="pi-title">${escapeHtml(p.title)}</div>
        <div class="pi-num">#${p.id}</div>
      </div>
    `;
  }).join('');
  root.innerHTML = `
    <button class="back" id="back-home">← All Categories</button>
    <p class="section-title">${escapeHtml(cat.name)}</p>
    <div class="prompt-list">${list}</div>
  `;
  $('#back-home').addEventListener('click', renderHome);
  root.querySelectorAll('.prompt-item').forEach((el) => {
    el.addEventListener('click', () => renderPrompt(parseInt(el.dataset.pid, 10)));
  });
}

function renderPrompt(pid) {
  STATE.view = 'prompt'; STATE.promptId = pid;
  const p = DATA.prompts.find((x) => x.id === pid);
  const cat = DATA.categories.find((c) => c.id === p.category_id);
  if (isLocked(p.id)) {
    root.innerHTML = `
      <button class="back" id="back-cat">← ${escapeHtml(cat.name)}</button>
      <div class="prompt-block">
        <div class="pb-cat">${escapeHtml(cat.name)}</div>
        <h2>${escapeHtml(p.title)}</h2>
      </div>
      <div class="locked-banner">
        <h3>Locked Prompt</h3>
        <p>This prompt unlocks with your Promptdeed access code.</p>
        <button id="go-settings">Enter Unlock Code</button>
      </div>
    `;
    $('#back-cat').addEventListener('click', () => renderCategory(cat.id));
    $('#go-settings').addEventListener('click', renderSettings);
    return;
  }
  root.innerHTML = `
    <button class="back" id="back-cat">← ${escapeHtml(cat.name)}</button>
    <div class="prompt-block">
      <div class="pb-cat">${escapeHtml(cat.name)} · #${p.id}</div>
      <h2>${escapeHtml(p.title)}</h2>
      <div class="pb-section-label">Prompt</div>
      <pre id="prompt-text"></pre>
      <button class="copy-btn" id="copy-prompt">Copy Prompt to Clipboard</button>
    </div>
    <div class="prompt-block">
      <div class="pb-section-label">Example Input</div>
      <pre id="ex-in"></pre>
      <button class="copy-btn" id="copy-input" style="background:#B8743D">Copy Example Input</button>
    </div>
    <div class="prompt-block">
      <div class="pb-section-label">Example Output</div>
      <pre id="ex-out"></pre>
    </div>
  `;
  $('#prompt-text').textContent = p.text;
  $('#ex-in').textContent = p.input;
  $('#ex-out').textContent = p.output;
  $('#back-cat').addEventListener('click', () => renderCategory(cat.id));
  $('#copy-prompt').addEventListener('click', (e) => copyToClipboard(p.text, e.currentTarget));
  $('#copy-input').addEventListener('click', (e) => copyToClipboard(p.input, e.currentTarget));
}

function renderSettings() {
  STATE.view = 'settings';
  root.innerHTML = `
    <button class="back" id="back-home">← Home</button>
    <p class="section-title">Settings</p>
    <div class="prompt-block">
      <div class="settings-row">
        <label for="code">Unlock Code</label>
        <input class="input" id="code" type="text" placeholder="PROMPTDEED-XXXXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <div class="help">Enter the access code you received with your purchase to unlock all 50 prompts.</div>
        <button class="btn-primary" id="apply-code">Apply Code</button>
        <div class="status" id="code-status"></div>
      </div>
      <div class="unlock-state">
        Status: <strong>${STATE.unlocked ? 'Unlocked — all 50 prompts available' : `Free preview (first ${DATA.free_prompt_count} prompts)`}</strong>
      </div>
      ${STATE.unlocked ? '<button class="btn-primary" id="reset-unlock" style="background:#8B2A1A">Reset to Free Preview</button>' : ''}
    </div>
    <div class="prompt-block">
      <div class="pb-section-label">About Promptdeed</div>
      <p style="margin:6px 0 0;font-size:14px">${escapeHtml(DATA.brand.subheadline)}</p>
      <p style="margin:10px 0 0;font-size:13px;color:#6B7280">Version 1.0.0 · ${DATA.prompts.length} prompts · ${DATA.categories.length} categories</p>
    </div>
  `;
  $('#back-home').addEventListener('click', renderHome);
  const apply = async () => {
    const v = $('#code').value.trim().toUpperCase();
    const status = $('#code-status');
    if (v === DATA.unlock_code) {
      status.className = 'status ok';
      status.textContent = 'Unlocking...';
      const ok = await loadLockedContent();
      if (!ok) {
        status.className = 'status err';
        status.textContent = 'Could not reach the content server. Check your connection and try again.';
        return;
      }
      localStorage.setItem('promptdeed_unlocked', '1');
      STATE.unlocked = true;
      status.className = 'status ok';
      status.textContent = 'Unlocked! All 50 prompts are now available.';
      setTimeout(renderSettings, 900);
    } else {
      status.className = 'status err';
      status.textContent = 'Invalid code. Check your purchase email or contact support.';
    }
  };
  $('#apply-code').addEventListener('click', apply);
  $('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });
  const reset = $('#reset-unlock');
  if (reset) reset.addEventListener('click', () => {
    localStorage.removeItem('promptdeed_unlocked');
    STATE.unlocked = false;
    renderSettings();
  });
}

/* ---------- WIRE ---------- */
$('#brand-home').addEventListener('click', renderHome);
$('#settings-btn').addEventListener('click', renderSettings);

if (STATE.unlocked) {
  loadLockedContent().then(renderHome);
} else {
  renderHome();
}

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
